name: Build wheel

on:
  push:
    branches:
      - main
      - "r**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versioningit needs full history + tags

      - name: Install uv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build wheel and sdist
        run: |
          uv build

      - name: Validate distributions with twine
        run: |
          uv tool run twine check dist/*

      - name: Install wheel and import smoke test
        run: |
          uv venv .venv-install --python 3.13
          source .venv-install/bin/activate
          uv pip install dist/*.whl
          python -c "import nemo.lens; print('nemo.lens version:', nemo.lens.__version__ if hasattr(nemo.lens, '__version__') else '(no __version__)')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
