name: Claude Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    if: github.event.issue.pull_request != null && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_claude_review.yml@1fc7b2f024bac423b1825a57182f3628c5fcb1f1 # v1.7.0
    with:
      model: ${{ vars.CLAUDE_MODEL }}
      prompt: |
        Read `skills/lens-review/SKILL.md` in this repository and follow it.
        That file is the review procedure and the single source of truth; it is
        shared with every harness, so do not substitute your own checklist for
        it. Read `AGENTS.md` too — the review enforces the invariants it states.

        If `skills/lens-review/SKILL.md` is not present in the checkout (an old
        branch, or the repo was not checked out), fall back to a light review of
        critical bugs, typos, missing test coverage, and documentation the diff
        made inaccurate — and say in your comment that the skill was unavailable.

        Delivery constraints for this CI context, on top of the skill:
        - Keep it concise and actionable. This is a bot comment on someone's PR.
        - Use inline comments for specific code suggestions; use a top-level
          comment for general observations.
        - Do not comment on style, formatting, or naming polish — ruff and
          pre-commit own those, and the skill's "Out of scope" section applies.
        - Having nothing to report is a perfectly good outcome. Do not
          manufacture findings. If the change is clean, post "LGTM".
    secrets:
      NVIDIA_INFERENCE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
      NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}
