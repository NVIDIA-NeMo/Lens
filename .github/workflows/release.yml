name: "Build, validate, and release NeMo-Lens"

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Existing version tag to release (vX.Y.Z or vX.Y.ZrcN)
        required: true
        type: string
      dry-run:
        description: Compute the release but do not publish wheel, GH release, or docs.
        required: true
        default: true
        type: boolean
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      generate-changelog:
        description: Generate changelog
        required: false
        default: true
        type: boolean
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pre-flight:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@cf5acebace78c7c339bc1f804357a991336f1c4d # v1.8.10
    with:
      default_runner_prefix: ${{ vars.DEFAULT_RUNNER_PREFIX }}
      non_nvidia_runner_prefix: ${{ vars.NON_NVIDIA_RUNNER_PREFIX }}
      default_test_data_path: ${{ vars.DEFAULT_TEST_DATA_PATH }}
      non_nvidia_test_data_path: ${{ vars.NON_NVIDIA_TEST_DATA_PATH }}
      sso_users_filename: ${{ vars.SSO_USERS_FILENAME }}
    secrets: inherit  # pragma: allowlist secret

  release-ref:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Select build ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release-ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc(0|[1-9][0-9]*))?$ ]]; then
                  echo "::error::release-ref must be an existing vX.Y.Z or vX.Y.ZrcN tag"
                  exit 1
              fi
              echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
              echo "ref=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release tag with history
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release-ref }}
        run: |
          python -m pip install 'setuptools-scm>=8'
          python - <<'PYTHON'
          import os
          from setuptools_scm import get_version

          expected = os.environ["RELEASE_TAG"][1:]
          actual = get_version()
          if actual != expected:
              raise SystemExit(f"Tag declares {expected}, but SCM resolves {actual}")
          PYTHON

  release:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_library.yml@d48ee21a4986f7281abf746b7d500880c0e91f41 # v1.5.1
    needs: [pre-flight, release-ref]
    if: |
      !cancelled() && !failure()
      && (github.event_name == 'workflow_dispatch'
          || !(needs.pre-flight.outputs.docs_only == 'true'
               || needs.pre-flight.outputs.is_deployment_workflow == 'true'))
    with:
      release-ref: ${{ needs.release-ref.outputs.ref }}
      python-package: nemo.lens
      library-name: NeMo-Lens
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      skip-version-bump: true
      create-gh-release: ${{ inputs.create-gh-release || false }}
      gh-release-use-changelog-builder: ${{ inputs.generate-changelog || false }}
      gh-release-from-tag: ${{ inputs.gh-release-from-tag || '' }}
      packaging: uv
      has-src-dir: true
      publish-docs: false
      skip-test-wheel: true
      app-id: ${{ vars.BOT_ID }}
      submodules: recursive
      restrict-to-admins: true
    secrets: inherit  # pragma: allowlist secret

  release-summary:
    needs: [pre-flight, release-ref, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED_JOBS=$(gh run view $GITHUB_RUN_ID --repo ${{ github.repository }} --json jobs --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required")] | length')

          if [ "${FAILED_JOBS:-0}" -eq 0 ]; then
              echo "✅ All previous jobs completed successfully"
              exit 0
          else
              echo "❌ Found $FAILED_JOBS failed job(s)"
              gh run view $GITHUB_RUN_ID --repo ${{ github.repository }} --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required") | .name'
              exit 1
          fi
