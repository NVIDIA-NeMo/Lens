instances:
  - url: https://nemo-lens.docs.buildwithfern.com/nemo/lens
    custom-domain: docs.nvidia.com/nemo/lens
    multi-source: true

title: NVIDIA NeMo Lens

global-theme: nvidia

metadata:
  canonical-host: "docs.nvidia.com/nemo/lens"

logo:
  href: /nemo/lens
  right-text: NeMo Lens

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-NeMo/Lens

libraries:
  nemo-lens:
    input:
      git: https://github.com/NVIDIA-NeMo/Lens
      subpath: src/nemo/lens
    output:
      path: ./product-docs/nemo-lens/Full-Library-Reference
    lang: python
  # nemo-lens-local:
  #   input:
  #     path: ../../src/nemo/lens
  #   output:
  #     path: ./product-docs/nemo-lens/Full-Library-Reference
  #   lang: python

versions:
  - display-name: "0.1.0"
    slug: 0.1.0
    path: ./versions/0.1.0.yml
    availability: stable
  - display-name: Nightly
    slug: nightly
    path: ./versions/nightly.yml
    availability: beta

redirects:
  - source: "/nemo/lens/index.html"
    destination: "/nemo/lens/0.1.0"
  - source: "/nemo/lens/index"
    destination: "/nemo/lens/0.1.0"
  - source: "/nemo/lens/0.1.0/index.html"
    destination: "/nemo/lens/0.1.0"
  - source: "/nemo/lens/0.1.0/index"
    destination: "/nemo/lens/0.1.0"
  - source: "/nemo/lens/nightly/index.html"
    destination: "/nemo/lens/nightly"
  - source: "/nemo/lens/nightly/index"
    destination: "/nemo/lens/nightly"
  - source: "/nemo/lens/0.1.0/:path*/index.html"
    destination: "/nemo/lens/0.1.0/:path*"
  - source: "/nemo/lens/nightly/:path*/index.html"
    destination: "/nemo/lens/nightly/:path*"
  - source: "/nemo/lens/:path*/index.html"
    destination: "/nemo/lens/:path*"
  - source: "/nemo/lens/:path*.html"
    destination: "/nemo/lens/:path*"

experimental:
  basepath-aware: true
