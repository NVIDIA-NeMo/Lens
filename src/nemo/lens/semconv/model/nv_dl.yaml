groups:
- id: registry.nv.dl
  type: attribute_group
  brief: nv.dl.* attribute names.
  attributes:
  - id: nv.dl.rank
    type: int
    stability: development
    brief: This participant's global rank in the training world.
    annotations:
      constant: NV_DL_RANK
  - id: nv.dl.world_size
    type: int
    stability: development
    brief: Total number of participants in the training world.
    annotations:
      constant: NV_DL_WORLD_SIZE
  - id: nv.dl.local_rank
    type: int
    stability: development
    brief: This participant's rank within its node.
    annotations:
      constant: NV_DL_LOCAL_RANK
  - id: nv.dl.role
    type: string
    stability: development
    brief: What kind of process this is.
    examples:
    - trainer
    - ckpt_worker
    - launcher
    - generator
    annotations:
      constant: NV_DL_ROLE
  - id: nv.dl.provider.name
    type: string
    stability: development
    brief: The execution engine running the workload, not the framework wrapping it.
    examples:
    - mcore
    - vllm
    - sglang
    annotations:
      constant: NV_DL_PROVIDER_NAME
  - id: nv.dl.topology.size.tp
    type: int
    stability: development
    brief: 'Tensor-parallel degree: the number of ranks the model''s tensors are sharded across.'
    annotations:
      constant: NV_DL_TOPOLOGY_SIZE_TP
  - id: nv.dl.topology.size.pp
    type: int
    stability: development
    brief: 'Pipeline-parallel degree: the number of pipeline stages the model is split into.'
    annotations:
      constant: NV_DL_TOPOLOGY_SIZE_PP
  - id: nv.dl.topology.size.dp
    type: int
    stability: development
    brief: 'Data-parallel degree: the number of model replicas trained in parallel.'
    annotations:
      constant: NV_DL_TOPOLOGY_SIZE_DP
  - id: nv.dl.training.config.global_batch_size
    type: int
    stability: development
    brief: Configured global batch size, in samples.
    annotations:
      constant: NV_DL_TRAINING_CONFIG_GLOBAL_BATCH_SIZE
  - id: nv.dl.training.config.micro_batch_size
    type: int
    stability: development
    brief: Configured micro-batch size, in samples (the per-pipeline-micro-step batch). Lens spells this
      `micro_batch_size`; the standalone registry spells it `microbatch_size`. The Lens spelling is recorded
      here as-is; reconciling the two is deferred (see model/README.md).
    annotations:
      constant: NV_DL_TRAINING_CONFIG_MICRO_BATCH_SIZE
  - id: nv.dl.training.config.sequence_length
    type: int
    stability: development
    brief: Sequence length, in tokens.
    annotations:
      constant: NV_DL_TRAINING_CONFIG_SEQUENCE_LENGTH
  - id: nv.dl.training.config.optimizer
    type: string
    stability: development
    brief: Optimizer type.
    examples:
    - adam
    - muon
    annotations:
      constant: NV_DL_TRAINING_CONFIG_OPTIMIZER
  - id: nv.dl.training.config.recompute_granularity
    type: string
    stability: development
    brief: Activation recomputation granularity.
    examples:
    - full
    - selective
    annotations:
      constant: NV_DL_TRAINING_CONFIG_RECOMPUTE_GRANULARITY
  - id: nv.dl.training.target.train_iters
    type: int
    stability: development
    brief: Target number of training iterations. Lens spells this `train_iters`; the standalone registry
      spells it `train_iterations`. The Lens spelling is recorded here as-is; reconciling the two is deferred
      (see model/README.md).
    annotations:
      constant: NV_DL_TRAINING_TARGET_TRAIN_ITERS
  - id: nv.dl.training.target.train_samples
    type: int
    stability: development
    brief: Target number of training samples.
    annotations:
      constant: NV_DL_TRAINING_TARGET_TRAIN_SAMPLES
  - id: nv.dl.training.target.train_tokens
    type: int
    stability: development
    brief: Target number of training tokens.
    annotations:
      constant: NV_DL_TRAINING_TARGET_TRAIN_TOKENS
  - id: nv.dl.software.torch
    type: string
    stability: development
    brief: PyTorch version.
    annotations:
      constant: NV_DL_SOFTWARE_TORCH
  - id: nv.dl.software.cuda
    type: string
    stability: development
    brief: CUDA version PyTorch was built against.
    annotations:
      constant: NV_DL_SOFTWARE_CUDA
  - id: nv.dl.software.nccl
    type: string
    stability: development
    brief: NCCL version.
    annotations:
      constant: NV_DL_SOFTWARE_NCCL
  - id: nv.dl.software.transformer_engine
    type: string
    stability: development
    brief: TransformerEngine version.
    annotations:
      constant: NV_DL_SOFTWARE_TRANSFORMER_ENGINE
  - id: nv.dl.launch.container.image
    type: string
    stability: development
    brief: Container image name, tag and digest.
    annotations:
      constant: NV_DL_LAUNCH_CONTAINER_IMAGE
  - id: nv.dl.job.uuid
    type: string
    stability: development
    brief: The training effort as submitted. Stable across every restart and requeue.
    annotations:
      constant: NV_DL_JOB_UUID
  - id: nv.dl.run.uuid
    type: string
    stability: development
    brief: One incarnation of the job. Changes on every restart.
    annotations:
      constant: NV_DL_RUN_UUID
  - id: nv.dl.campaign.stage
    type: string
    stability: development
    brief: The phase of the model's training campaign this job belongs to.
    note: >-
      Set by the job script as a resource attribute. Separates RL from pretraining
      without inferring it from the job name.
    examples: ['pre-train', 'mid-train', 'sft', 'distillation', 'rl']
    annotations:
      constant: NV_DL_CAMPAIGN_STAGE
  - id: nv.dl.launch.nnodes.active
    type: int
    stability: development
    brief: The number of nodes meant to run the workload, excluding spares.
    annotations:
      constant: NV_DL_LAUNCH_NNODES_ACTIVE
  - id: nv.dl.launch.nnodes.spare
    type: int
    stability: development
    brief: Allocated nodes held back from the workload (allocation minus active).
    annotations:
      constant: NV_DL_LAUNCH_NNODES_SPARE

  # GPU sniff-test (nv.dl.resiliency.gpu_sniff.*): an on-GPU micro-benchmark run
  # at startup and on an interval; these attributes tag its per-run measurement
  # event, not a long-lived span. Parked under nv.dl.* (neutral) rather than
  # nv.nvrx.* so fault-tolerance can consume it without importing the trainer's
  # vocabulary. The sniff-test spans and measurement event are emitted by
  # Megatron; the workload-shape attributes below say which benchmark
  # configuration a measurement came from.
  - id: nv.dl.resiliency.gpu_sniff.benchmark
    type: string
    stability: development
    brief: Which benchmark this measurement is from.
    examples: ['gemm', 'all_reduce', 'reduce_scatter', 'all_to_all', 'send_recv']
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_BENCHMARK
  - id: nv.dl.resiliency.gpu_sniff.value
    type: double
    stability: development
    brief: The measured value.
    note: >-
      Carries no unit annotation, deliberately — the unit varies by benchmark, so
      it travels as data in `nv.dl.resiliency.gpu_sniff.unit` rather than as
      schema metadata.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_VALUE
  - id: nv.dl.resiliency.gpu_sniff.unit
    type: string
    stability: development
    brief: The unit of `nv.dl.resiliency.gpu_sniff.value`, as a runtime value.
    examples: ['TFLOP/s', 'GB/s']
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_UNIT
  - id: nv.dl.resiliency.gpu_sniff.tag
    type: string
    stability: development
    brief: Free-text label for which invocation of the sniff test this is.
    note: Unstructured free-text; carried because a producer exists today.
    examples: ['before training', 'iteration    1000']
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_TAG
  - id: nv.dl.resiliency.gpu_sniff.gemm.m
    type: int
    stability: development
    brief: GEMM M dimension of the benchmarked matmul.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_GEMM_M
  - id: nv.dl.resiliency.gpu_sniff.gemm.n
    type: int
    stability: development
    brief: GEMM N dimension of the benchmarked matmul.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_GEMM_N
  - id: nv.dl.resiliency.gpu_sniff.gemm.k
    type: int
    stability: development
    brief: GEMM K dimension of the benchmarked matmul.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_GEMM_K
  - id: nv.dl.resiliency.gpu_sniff.gemm.dtype
    type: string
    stability: development
    brief: Data type of the benchmarked matmul.
    examples: ['bf16']
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_GEMM_DTYPE
  - id: nv.dl.resiliency.gpu_sniff.gemm.label
    type: string
    stability: development
    brief: Human-readable name of the benchmarked matmul shape.
    examples: ['up-proj/fc1', 'down-proj/fc2']
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_GEMM_LABEL
  - id: nv.dl.resiliency.gpu_sniff.message_size
    type: int
    stability: development
    brief: Message size of a communication benchmark.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_MESSAGE_SIZE
  - id: nv.dl.resiliency.gpu_sniff.group_size
    type: int
    stability: development
    brief: Number of ranks taking part in a communication benchmark.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_GROUP_SIZE
  - id: nv.dl.resiliency.gpu_sniff.peer_stride
    type: int
    stability: development
    brief: Rank distance to the peer in a send/recv benchmark.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_PEER_STRIDE
  - id: nv.dl.resiliency.gpu_sniff.peer_rank
    type: int
    stability: development
    brief: The peer rank in a send/recv benchmark.
    annotations:
      constant: NV_DL_RESILIENCY_GPU_SNIFF_PEER_RANK

  # Per-span and per-event training attributes, carried on the spans and events
  # Megatron emits. lens-monitor reads several of them to number iterations and
  # to find the last durable checkpoint, so a rename lowers measured goodput
  # without an error (README rule 3).
  - id: nv.dl.training.step
    type: int
    stability: development
    brief: Global training step, monotonic within a job across restarts.
    annotations:
      constant: NV_DL_TRAINING_STEP
  - id: nv.dl.training.iteration.is_first
    type: boolean
    stability: development
    brief: Whether this is the first iteration this process executed.
    annotations:
      constant: NV_DL_TRAINING_ITERATION_IS_FIRST
  - id: nv.dl.training.iteration.skipped
    type: boolean
    stability: development
    brief: Whether this iteration's optimizer update was skipped.
    annotations:
      constant: NV_DL_TRAINING_ITERATION_SKIPPED
  - id: nv.dl.training.optimizer.update_successful
    type: boolean
    stability: development
    brief: Whether the optimizer step applied its update.
    annotations:
      constant: NV_DL_TRAINING_OPTIMIZER_UPDATE_SUCCESSFUL
  - id: nv.dl.training.resume_iteration
    type: int
    stability: development
    brief: The step training resumes from after a checkpoint load.
    annotations:
      constant: NV_DL_TRAINING_RESUME_ITERATION
  - id: nv.dl.training.checkpoint.last_iteration_step
    type: int
    stability: development
    brief: The step of the checkpoint that became durable during this finalize.
    note: >-
      Set only on the finalize span whose pass committed an asynchronous save,
      and carries the step that save started at, not the current step. A save
      is durable only once this is recorded; a completed save span is not enough.
    annotations:
      constant: NV_DL_TRAINING_CHECKPOINT_LAST_ITERATION_STEP
  - id: nv.dl.training.checkpoint.source_iteration
    type: int
    stability: development
    brief: The step of the checkpoint a load read.
    annotations:
      constant: NV_DL_TRAINING_CHECKPOINT_SOURCE_ITERATION
  - id: nv.dl.training.checkpoint.source_path
    type: string
    stability: development
    brief: The path of the checkpoint a load read.
    note: >-
      Absent for node-local checkpoints, which have no shared path.
    examples: ['/checkpoints/my-run']
    annotations:
      constant: NV_DL_TRAINING_CHECKPOINT_SOURCE_PATH
  - id: nv.dl.training.evaluate.iteration
    type: int
    stability: development
    brief: The evaluation iteration within the current evaluation pass.
    annotations:
      constant: NV_DL_TRAINING_EVALUATE_ITERATION
  - id: nv.dl.training.evaluate.iteration_count
    type: int
    stability: development
    brief: The number of iterations in this evaluation pass.
    annotations:
      constant: NV_DL_TRAINING_EVALUATE_ITERATION_COUNT
  - id: nv.dl.measurement.domain
    type: string
    stability: development
    brief: The reduction a reported value represents.
    note: >-
      `dp_mean` is averaged across data-parallel ranks; `local` is this rank's own value.
    examples: ['dp_mean', 'local']
    annotations:
      constant: NV_DL_MEASUREMENT_DOMAIN
  - id: nv.dl.training.objective.name
    type: string
    stability: development
    brief: Which training objective this value belongs to.
    examples: ['lm loss', 'load_balancing_loss']
    annotations:
      constant: NV_DL_TRAINING_OBJECTIVE_NAME
  - id: nv.dl.training.objective.value
    type: double
    stability: development
    brief: The reported value of this objective at this step.
    annotations:
      constant: NV_DL_TRAINING_OBJECTIVE_VALUE
  - id: nv.dl.training.objective.weight
    type: double
    stability: development
    brief: Coefficient this objective carries in the combined loss.
    annotations:
      constant: NV_DL_TRAINING_OBJECTIVE_WEIGHT
  - id: nv.dl.training.learning_rate
    type: double
    stability: development
    brief: Learning rate applied at this step.
    annotations:
      constant: NV_DL_TRAINING_LEARNING_RATE
  - id: nv.dl.training.global_batch_size
    type: int
    stability: development
    brief: Global batch size in effect at this step.
    note: >-
      Can change during training (batch-size ramp-up), unlike the resource
      attribute `nv.dl.training.config.global_batch_size`.
    annotations:
      constant: NV_DL_TRAINING_GLOBAL_BATCH_SIZE
  - id: nv.dl.training.consumed_samples
    type: int
    stability: development
    brief: Cumulative samples consumed by the job up to and including this step.
    annotations:
      constant: NV_DL_TRAINING_CONSUMED_SAMPLES
  - id: nv.dl.training.grad_zeros
    type: int
    stability: development
    brief: Count of zero entries in the gradient at this step.
    annotations:
      constant: NV_DL_TRAINING_GRAD_ZEROS
  - id: nv.dl.training.params_norm
    type: double
    stability: development
    brief: Global parameter norm at this step.
    annotations:
      constant: NV_DL_TRAINING_PARAMS_NORM
  - id: nv.dl.training.skipped_iterations
    type: int
    stability: development
    brief: Number of iterations skipped, e.g. for non-finite gradients.
    annotations:
      constant: NV_DL_TRAINING_SKIPPED_ITERATIONS
  - id: nv.dl.training.nan_iterations
    type: int
    stability: development
    brief: Number of iterations that produced a non-finite loss.
    annotations:
      constant: NV_DL_TRAINING_NAN_ITERATIONS
  - id: nv.dl.training.loss_scale
    type: double
    stability: development
    brief: Mixed-precision gradient loss scale at this step.
    annotations:
      constant: NV_DL_TRAINING_LOSS_SCALE
