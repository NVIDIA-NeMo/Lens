# OVERLAY: add a LIVE Honeycomb route for the GOODPUT subset, on top of otelcol.yaml. Deep-merged via a
# second --config:
#   otelcol-contrib --config otelcol.yaml --config otelcol_honeycomb.yaml \
#                   --feature-gates=exporter.file.nativeCompression
#
# The base writes ONE disk archive of everything. This overlay inserts a routing connector so that:
#   * EVERYTHING still lands in the disk archive (file/archive) -- unchanged, and
#   * goodput-category spans ALSO go live to Honeycomb.
# Scoping the live route to the goodput subset bounds external volume (NOT the full profiling firehose).
# Apply ONLY when you have an ingest key; the base stays disk-only by default. US endpoint; auth via the
# x-honeycomb-team header. Keep the key in a mode-600 file OUTSIDE git and export it to HONEYCOMB_API_KEY
# before launch -- never commit it.

connectors:
  routing:
    # Unmatched (non-goodput) spans -> disk archive only.
    default_pipelines: [traces/archive]
    table:
      - context: span
        condition: 'attributes["lens.span_category"] == "goodput"'
        pipelines: [traces/archive, traces/honeycomb]   # goodput -> disk AND live

exporters:
  otlp_http/honeycomb:
    endpoint: "https://api.honeycomb.io"
    headers:
      x-honeycomb-team: "${env:HONEYCOMB_API_KEY}"
    # Resilience: queue + retry so a transient egress hiccup doesn't drop spans (and never blocks the
    # workload -- the collector is out-of-band).
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  pipelines:
    # Re-point the base traces pipeline to feed the router instead of writing the archive directly.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [routing]
    traces/archive:
      receivers: [routing]
      processors: [batch]
      exporters: [file/archive]
    traces/honeycomb:
      receivers: [routing]
      processors: [batch]
      exporters: [otlp_http/honeycomb]
