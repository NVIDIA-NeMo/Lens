# OpenTelemetry Collector configuration for NeMo Lens
#
# Pipelines:
#   Megatron (OTLP metrics) ──► Collector ──► Prometheus scrape endpoint
#   Megatron (OTLP logs)   ──► Collector ──► Elasticsearch
#   Host metrics (CPU/mem)  ──► Collector ──► Prometheus scrape endpoint
#   DCGM Exporter (GPU)    ──► Collector ──► Prometheus scrape endpoint
#   Node Exporter (IB/net) ──► Collector ──► Prometheus scrape endpoint

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ── Host metrics: CPU, memory, disk, network, load ──────────────────
  hostmetrics:
    root_path: /hostfs
    collection_interval: 10s
    scrapers:
      cpu:           # system.cpu.time, system.cpu.utilization
      memory:        # system.memory.usage, system.memory.utilization
      disk:          # system.disk.io, system.disk.operations
      network:       # system.network.io, system.network.packets, system.network.errors
      load:          # system.cpu.load_average.{1m,5m,15m}
      filesystem:    # system.filesystem.usage, system.filesystem.utilization
      processes:     # system.processes.count, system.processes.created
      paging:        # system.paging.usage, system.paging.operations

  # ── GPU metrics via DCGM Exporter (sidecar) ────────────────────────
  # Scrapes NVIDIA DCGM Exporter's Prometheus endpoint for:
  #   GPU utilization, memory, temperature, power, NVLink, PCIe, ECC, clocks
  prometheus/dcgm:
    config:
      scrape_configs:
        - job_name: dcgm
          scrape_interval: 10s
          static_configs:
            - targets: ["dcgm-exporter:9400"]

  # ── InfiniBand / network metrics via Node Exporter (sidecar) ───────
  # Scrapes Prometheus Node Exporter for:
  #   InfiniBand port counters, RDMA stats, NIC bandwidth, TCP retransmits
  prometheus/node:
    config:
      scrape_configs:
        - job_name: node
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]
          # Only keep relevant metrics — drop filesystem, textfile, etc.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "^(node_infiniband_|node_network_|node_nfs_|node_sockstat_|node_tcp_).*"
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 512
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    timeout: 5s
    override: false

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 3h
    resource_to_telemetry_conversion:
      enabled: true

  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    logs_index: nemo-logs
    mapping:
      mode: ecs
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info

  pipelines:
    # Training + host + GPU + network metrics → Prometheus
    metrics:
      receivers:  [otlp, hostmetrics, prometheus/dcgm, prometheus/node]
      processors: [memory_limiter, resourcedetection, batch]
      exporters:  [prometheus]

    # Training logs → Elasticsearch
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [elasticsearch]
