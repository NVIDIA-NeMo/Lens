# OpenTelemetry Collector configuration for NeMo Lens
#
# All three signals flow through the collector for fan-out:
#   Traces  ──► Jaeger (UI) + Elasticsearch (Kibana)
#   Metrics ──► Prometheus (Grafana) + Elasticsearch (Kibana)
#   Logs    ──► Elasticsearch (Kibana)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ── Host metrics: CPU, memory, disk, network, load ──────────────────
  hostmetrics:
    root_path: /hostfs
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      load:
      filesystem:
      processes:
      paging:

  # ── GPU metrics via DCGM Exporter (sidecar) ────────────────────────
  prometheus/dcgm:
    config:
      scrape_configs:
        - job_name: dcgm
          scrape_interval: 10s
          static_configs:
            - targets: ["dcgm-exporter:9400"]

  # ── InfiniBand / network metrics via Node Exporter (sidecar) ───────
  prometheus/node:
    config:
      scrape_configs:
        - job_name: node
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "^(node_infiniband_|node_network_|node_nfs_|node_sockstat_|node_tcp_).*"
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 512
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    timeout: 5s
    override: false

exporters:
  # ── Traces → Jaeger ────────────────────────────────────────────────
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # ── Metrics → Prometheus ───────────────────────────────────────────
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 3h
    resource_to_telemetry_conversion:
      enabled: true

  # ── Logs + Traces → Elasticsearch ──────────────────────────────────
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    logs_index: nemo-logs
    traces_index: nemo-traces
    mapping:
      mode: otel
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info

  pipelines:
    # Traces → Jaeger + Elasticsearch
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp/jaeger, elasticsearch]

    # Metrics → Prometheus + Elasticsearch
    metrics:
      receivers:  [otlp, hostmetrics, prometheus/dcgm, prometheus/node]
      processors: [memory_limiter, resourcedetection, batch]
      exporters:  [prometheus, elasticsearch]

    # Logs → Elasticsearch
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [elasticsearch]
