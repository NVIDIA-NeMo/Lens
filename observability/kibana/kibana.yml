# Kibana configuration for NeMo Lens
server.name: nemo-lens-kibana
server.host: "0.0.0.0"
server.defaultRoute: "/app/discover"

elasticsearch.hosts: ["http://elasticsearch:9200"]

# Required for saved objects encryption (alerts, actions, etc.)
xpack.encryptedSavedObjects.encryptionKey: "nemo-lens-dev-key-min-32-chars!!"

# Disable onboarding noise
telemetry.optIn: false
newsfeed.enabled: false

logging.root.level: warn
