apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      # Link Grafana metric panels → Jaeger trace explorer via exemplars.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    access: proxy
    jsonData:
      # Wire traces back to Prometheus metrics (trace → metrics side panel).
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service_name

  - name: Elasticsearch
    type: elasticsearch
    uid: elasticsearch
    url: http://elasticsearch:9200
    access: proxy
    jsonData:
      index: nemo-logs
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severity_text
