# OpenTelemetry Collector configuration — RabbitMQ sink.
#
# Publishes all three signals (traces, metrics, logs) to a RabbitMQ broker
# over AMQP using the contrib `rabbitmq` exporter:
#
#   OTLP in ──► batch ──► rabbitmq exporter ──► exchange nemo_lens.otel.raw
#
# Each signal is published with its default routing key (otlp_spans /
# otlp_metrics / otlp_logs); the broker's `#` binding routes them all to the
# nemo_lens-processing queue (see observability/rabbitmq/definitions.json).
#
# Wire format: OTLP-JSON. The `otlp_encoding` extension below marshals each
# message as a JSON ExportTraceServiceRequest / ExportMetricsServiceRequest /
# ExportLogsServiceRequest, so consumers can parse messages without protobuf
# tooling. Switch `protocol` to `otlp_proto` for the more compact binary form.
#
# Credentials must match the nemo_lens user seeded by definitions.json. This
# config is mounted by docker-compose.rabbitmq.yml, where `rabbitmq` resolves
# to the broker container on the shared network.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch/traces:
    timeout: 10s
    send_batch_size: 512

  batch/metrics:
    timeout: 30s
    send_batch_size: 1024

  batch/logs:
    timeout: 10s
    send_batch_size: 512

exporters:
  # ── Traces + Metrics + Logs → RabbitMQ ─────────────────────────────
  # AMQP publish to the nemo_lens.otel.raw exchange. `durable: true` marks
  # published messages persistent so they survive a broker restart. The
  # username/password must match the user seeded by definitions.json.
  rabbitmq/default:
    connection:
      endpoint: amqp://rabbitmq:5672
      auth:
        plain:
          username: nemo_lens
          password: example
    routing:
      exchange: nemo_lens.otel.raw
    encoding_extension: otlp_encoding/rabbitmq
    durable: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # Marshals exported telemetry as OTLP-JSON before publishing to RabbitMQ.
  otlp_encoding/rabbitmq:
    protocol: otlp_json

service:
  # Both extensions must be enabled here — the exporter resolves its encoder
  # from the running extensions, so otlp_encoding/rabbitmq has to be listed.
  extensions: [health_check, otlp_encoding/rabbitmq]

  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch/traces]
      exporters: [rabbitmq/default]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/metrics]
      exporters: [rabbitmq/default]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch/logs]
      exporters: [rabbitmq/default]
