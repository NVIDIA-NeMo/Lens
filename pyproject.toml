[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-lens"
dynamic = ["version"]
description = "Shared OpenTelemetry library for NVIDIA NeMo ecosystem (Megatron-LM, NeMo-RL, NeMo-Gym)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opentelemetry-api>=1.20.0",
]

[project.scripts]
nemo-lens = "nemo.lens.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nemo.lens.package_info.__version__" }

[project.optional-dependencies]
sdk = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
fastapi = [
    "nemo-lens[sdk]",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
]
aiohttp = [
    "nemo-lens[sdk]",
    "opentelemetry-instrumentation-aiohttp-client>=0.40b0",
]

[dependency-groups]
dev = [
    "nemo-lens[sdk]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.0",
    "ruff>=0.15.0,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nemo.lens", "nemo.lens.*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]
ignore = [
    "E501",  # line length handled by formatter
    "TC002", # runtime imports used in function signatures
    "TC003", # runtime imports used in function signatures
]

[tool.ruff.lint.isort]
known-first-party = ["nemo.lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/nemo/lens/semconv.py",
]

[tool.uv]
managed = true
