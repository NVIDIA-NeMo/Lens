[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-lens"
version = "0.1.0"
description = "Shared OpenTelemetry library for NVIDIA NeMo ecosystem (Megatron-LM, NeMo-RL, NeMo-Gym)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "NVIDIA Corporation" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
sdk = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
fastapi = [
    "nemo-lens[sdk]",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
]
aiohttp = [
    "nemo-lens[sdk]",
    "opentelemetry-instrumentation-aiohttp-client>=0.40b0",
]
dev = [
    "nemo-lens[sdk]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.0",
    "ruff>=0.11.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc2>=0.5",
    "nvidia-sphinx-theme>=0.0.5",
    "sphinx-autobuild>=2024.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]
ignore = [
    "E501",  # line length handled by formatter
    "TC002", # runtime imports used in function signatures
    "TC003", # runtime imports used in function signatures
]

[tool.ruff.lint.isort]
known-first-party = ["nemo.lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
